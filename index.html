<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<!-- SIDEBAR -->

<aside class="sidebar">


<div class="traffic-lights">

<span></span>
<span></span>
<span></span>

</div>



<h1>
Study
</h1>



<nav>

<button class="nav-btn active" data-page="today">
Today
</button>


<button class="nav-btn" data-page="timetable">
Timetable
</button>


<button class="nav-btn" data-page="tasks">
Tasks
</button>


<button class="nav-btn" data-page="assignments">
Assignments
</button>


<button class="nav-btn" data-page="planner">
AI Planner
</button>


<button class="nav-btn" data-page="settings">
Settings
</button>


</nav>



<div class="sidebar-footer">

<button id="themeToggle">
🌙 Dark Mode
</button>

</div>



</aside>






<!-- MAIN CONTENT -->

<main class="content">





<!-- TODAY PAGE -->

<section class="page active" id="today">


<div class="page-title">

<div>

<h2>
Today
</h2>

<p id="currentDate"></p>

</div>



<div class="next-class-card">


<p>
Next Class
</p>


<h3 id="nextClass">
Loading...
</h3>


<strong id="countdown">
</strong>


</div>


</div>





<div class="glass-card current-lesson">


<h3>
Current Lesson
</h3>


<div id="currentLesson">

No lesson currently running.

</div>


</div>







<div class="glass-card">


<h3>
Today's Subjects
</h3>


<div id="todayTimeline"
class="timeline">


</div>


</div>



</section>









<!-- TIMETABLE PAGE -->

<section class="page" id="timetable">


<div class="page-title">


<h2>
Overall Timetable
</h2>


<input 
id="timetableSearch"
placeholder="Search subject or teacher">


</div>




<div class="glass-card">


<div class="view-switch">


<button id="weeklyViewBtn">
Weekly
</button>


<button id="timelineViewBtn">
Timeline
</button>


</div>



<div id="weeklyTimetable">

</div>



<div id="timelineTimetable"
class="hidden">

</div>



</div>



</section>









<!-- TASKS PAGE -->

<section class="page" id="tasks">


<div class="page-title">

<h2>
Tasks
</h2>

</div>





<div class="dashboard-grid">



<div class="glass-card">


<h3>
Todo List
</h3>



<div class="input-row">


<input 
id="todoInput"
placeholder="Add task">


<button id="addTodo">
+
</button>


</div>



<ul id="todoList">

</ul>


</div>







<div class="glass-card">


<h3>
Homework Tracker
</h3>


<div id="homeworkTracker">

</div>


</div>



</div>


</section>









<!-- ASSIGNMENTS -->

<section class="page" id="assignments">


<div class="page-title">

<h2>
Assignment Tracker
</h2>


</div>




<div class="glass-card">


<div class="input-row">


<input
id="assignmentName"
placeholder="Assignment name">


<input
id="assignmentSubject"
placeholder="Subject">


<button id="addAssignment">
+
</button>


</div>



<div id="assignmentList">

</div>


</div>



</section>









<!-- AI PLANNER -->

<section class="page" id="planner">


<div class="page-title">

<h2>
AI Study Planner
</h2>

</div>





<div class="glass-card">


<textarea
id="plannerInput"
placeholder="
Enter upcoming tests, homework and deadlines...
"></textarea>



<button id="generatePlan">

Generate Study Plan

</button>




<div id="studyPlan">

</div>


</div>


</section>









<!-- SETTINGS -->

<section class="page" id="settings">


<div class="page-title">

<h2>
Settings
</h2>


</div>






<div class="glass-card">


<h3>
Import Timetable
</h3>


<p>
Import your school's .ics calendar file.
</p>



<input
type="file"
id="icsInput"
accept=".ics">


<p id="importStatus">

</p>


</div>








<div class="glass-card">


<h3>
Subject Colours
</h3>



<div id="subjectColours">

</div>


</div>




</section>







</main>



</div>





<script type="module" src="app.js"></script>


</body>


</html>
